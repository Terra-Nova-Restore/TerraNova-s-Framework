name: Validate Notion Map

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/notion_map*.json'
      - 'scripts/notion_to_github.py'
      - 'scripts/preflight.py'
      - 'scripts/validate_notion_map.py'
      - 'tests/test_notion_to_github.py'
      - '.github/workflows/notion-map-validate.yml'
  push:
    paths:
      - 'config/notion_map*.json'
      - 'scripts/notion_to_github.py'
      - 'scripts/preflight.py'
      - 'scripts/validate_notion_map.py'
      - 'tests/test_notion_to_github.py'
      - '.github/workflows/notion-map-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config_path:
          - config/notion_map.json
          - config/notion_map.science.v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate map
        run: python scripts/validate_notion_map.py ${{ matrix.config_path }}

      - name: Validate sync hardening logic
        run: |
          python -m py_compile scripts/notion_to_github.py scripts/preflight.py scripts/validate_notion_map.py
          python -m unittest tests.test_notion_to_github
