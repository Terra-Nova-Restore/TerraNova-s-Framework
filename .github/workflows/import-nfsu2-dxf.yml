name: Temporary NFSU2 DXF import

on:
  push:
    paths:
      - '.github/workflows/import-nfsu2-dxf.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified DXF payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nfsu2/bayview-laser-map
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-e788-81f4-bd10-c01c5e822d0c/raw?se=2026-09-01T17%3A51%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=d71b484e-2c52-5f35-82e2-e1978e7a9b50&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T05%3A27%3A03Z&ske=2026-09-02T05%3A27%3A03Z&sks=b&skv=2026-02-06&sig=42YwPTCe9NsQGRQkkN0CLQJJd7GjqPyBUVkgVqfrw3s%3D' -o artifacts/nfsu2/bayview-laser-map/NFSU2_Bayview_centerline_R2000.dxf
          test "$(wc -c < artifacts/nfsu2/bayview-laser-map/NFSU2_Bayview_centerline_R2000.dxf)" -eq 160694
          grep -q 'AC1015' artifacts/nfsu2/bayview-laser-map/NFSU2_Bayview_centerline_R2000.dxf
          grep -q 'MAP' artifacts/nfsu2/bayview-laser-map/NFSU2_Bayview_centerline_R2000.dxf
      - name: Commit DXF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/nfsu2/bayview-laser-map/NFSU2_Bayview_centerline_R2000.dxf
          git commit -m 'Add NFSU2 Bayview centerline DXF'
          git push
