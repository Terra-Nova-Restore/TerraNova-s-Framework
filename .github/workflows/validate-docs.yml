name: Validate Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'BIZ.md'
      - 'docs/architecture/ferrAI_operating_kernel_v0.1.md'
      - 'docs/codex/**'
      - 'docs/governance/**'
      - 'docs/references/zenodo.md'
      - 'releases/zenodo/**'
      - 'schemas/artifact_status.schema.json'
      - 'config/source_registry.json'
      - 'scripts/validate_docs.py'
      - 'tests/test_validate_docs.py'
      - '.github/workflows/validate-docs.yml'
      - '.github/workflows/zenodo-*.yml'
  push:
    paths:
      - 'BIZ.md'
      - 'docs/architecture/ferrAI_operating_kernel_v0.1.md'
      - 'docs/codex/**'
      - 'docs/governance/**'
      - 'docs/references/zenodo.md'
      - 'releases/zenodo/**'
      - 'schemas/artifact_status.schema.json'
      - 'config/source_registry.json'
      - 'scripts/validate_docs.py'
      - 'tests/test_validate_docs.py'
      - '.github/workflows/validate-docs.yml'
      - '.github/workflows/zenodo-*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate BIZ documentation markers
        run: python scripts/validate_docs.py

      - name: Run validator unit tests
        run: python -m unittest tests.test_validate_docs

      - name: Validate Zenodo release JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          zenodo_root = Path("releases/zenodo")
          if not zenodo_root.exists():
              print("No releases/zenodo directory present.")
              raise SystemExit(0)

          json_files = sorted(zenodo_root.rglob("*.json"))
          for path in json_files:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Validated {path}")

          print(f"Validated {len(json_files)} Zenodo JSON file(s).")
          PY

      - name: Validate registry and schema JSON
        run: |
          python -m json.tool schemas/artifact_status.schema.json > /dev/null
          python -m json.tool config/source_registry.json > /dev/null
